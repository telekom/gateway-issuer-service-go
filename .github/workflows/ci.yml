name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next

permissions:
  contents: read

concurrency:
  # Serialise runs per ref so releases on a branch never overlap, which keeps the
  # version-tag check race-free. Superseded pull request runs are cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ${{ vars.REGISTRY_HOST }}${{ vars.REGISTRY_REPO }}

jobs:
  format-go:
    name: Check Go formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 #v6.3.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: make fmt-check

  lint-go:
    name: Lint Go code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 #v6.3.0
        with:
          go-version-file: go.mod
      - name: Run linter
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 #v9.2.0

  lint-reuse:
    name: Check REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: REUSE compliance check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 #v6.0.0

  build-go:
    name: Build Go code
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.setup-go.outputs.go-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 #v6.3.0
        with:
          go-version-file: go.mod
      - name: Build
        run: make build

  govulncheck:
    name: Check for vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    needs: [build-go]
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@31f7c5463448f83528bd771c2d978d940080c9fd #master on 20260325 contains full commit SHAs
        with:
          go-version-input: ''
          go-version-file: go.mod
          go-package: ./...

  test-go-unit:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: [build-go]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 #v6.3.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: make test-unit

  compute-version:
    name: Compute release version
    runs-on: ubuntu-latest
    needs: [format-go, lint-go, lint-reuse, build-go, govulncheck, test-go-unit]
    # Only a push to a release branch may publish; pull requests skip this job and
    # publish-release along with it.
    if: github.event_name == 'push'
    permissions:
      # semantic-release verifies push access even in dry-run mode.
      contents: write
    outputs:
      new-release-published: ${{ steps.compute.outputs.new-release-published }}
      new-release-version: ${{ steps.compute.outputs.new-release-version }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: 'true'
      - name: Restore branch reference
        # semantic-release compares the local branch against its remote, so put HEAD back
        # on the branch name without moving it off the validated commit.
        env:
          BRANCH: ${{ github.ref_name }}
        run: git checkout -B "${BRANCH}"
      - name: Compute version
        # Dry run only: decides the version for the image tag before anything is built.
        id: compute
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 #v6.0.0
        with:
          semantic_version: 25.0.2
          dry_run: true
          extra_plugins: |
            semantic-release-export-data@1.1.1
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    name: Build, qualify, and publish image
    runs-on: ubuntu-latest
    needs: [format-go, lint-go, lint-reuse, build-go, govulncheck, test-go-unit, compute-version]
    # Runs for same-repository pull requests (compute-version is skipped there) and for
    # pushes that publish a release. Fork pull requests have no registry credentials.
    # Dependabot pull requests require matching Dependabot secrets.
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        needs.compute-version.outputs.new-release-published == 'true'
      )
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Inject slug variables
        uses: rlespinasse/github-slug-action@ef93b2ea4b6405d06fd8684fc3ff795d262ecae8 #v5.7.0
      - name: Determine image metadata
        id: metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_VERSION: ${{ needs.compute-version.outputs.new-release-version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Preview images carry a floating tag and expire; release images are immutable.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            tag="pr-${PR_NUMBER}-${GITHUB_HEAD_REF_SLUG}"
            version="${tag}-${SOURCE_SHA:0:7}"
            expiration=3months
          else
            tag="${RELEASE_VERSION}"
            version="${RELEASE_VERSION}"
            expiration=''
          fi
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "expiration=${expiration}"
          } >> "${GITHUB_OUTPUT}"
      - name: Login to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 #v3.7.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
          password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b #v0.7
      - name: Refuse to overwrite a foreign version image
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # SemVer image tags are immutable. A version tag may only pre-exist from an
          # interrupted release of this same commit, which this run then completes.
          tags="$(crane ls "${IMAGE_REPOSITORY}")"
          if ! grep -qx "${RELEASE_VERSION}" <<< "${tags}"; then
            exit 0
          fi
          digest="$(crane digest "${IMAGE_REPOSITORY}:${RELEASE_VERSION}")"
          revision="$(crane config "${IMAGE_REPOSITORY}@${digest}" | jq -r '.config.Labels["org.opencontainers.image.revision"] // ""')"
          if [ "${revision}" != "${SOURCE_SHA}" ]; then
            printf '%s:%s already exists for revision %s, expected %s\n' \
              "${IMAGE_REPOSITORY}" "${RELEASE_VERSION}" "${revision:-unknown}" "${SOURCE_SHA}" >&2
            exit 1
          fi
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f #v3.12.0
      - name: Build and push image by digest
        # The image gets its tag only after it passed the scan and signature steps below.
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 #v6.19.2
        with:
          file: Dockerfile.multi-stage
          build-args: |
            GO_VERSION=${{ needs.build-go.outputs.go-version }}
            VERSION=${{ steps.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.expiration && format('expiration={0}', steps.metadata.outputs.expiration) || '' }}
          outputs: type=image,name=${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE_REPOSITORY }}:latest
          cache-to: type=inline
          no-cache-filters: runtime
          platforms: linux/amd64,linux/arm64
          provenance: false
      - name: Scan AMD64 image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 #v0.35.0
        env:
          TRIVY_USERNAME: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
          TRIVY_PASSWORD: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          exit-code: '1'
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan ARM64 image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 #v0.35.0
        env:
          TRIVY_USERNAME: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
          TRIVY_PASSWORD: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          exit-code: '1'
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: v2.5.3
      - name: Sign and verify image index
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
          IMAGE: ${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY --recursive --tlog-upload=false --yes "${IMAGE}"
          cosign verify --insecure-ignore-tlog=true --key env://COSIGN_PUBLIC_KEY "${IMAGE}" >/dev/null
      - name: Publish and verify tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          crane tag "${IMAGE_REPOSITORY}@${DIGEST}" "${TAG}"
          test "$(crane digest "${IMAGE_REPOSITORY}:${TAG}")" = "${DIGEST}"

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [compute-version, publish-image]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: 'true'
      - name: Restore branch reference
        env:
          BRANCH: ${{ github.ref_name }}
        run: git checkout -B "${BRANCH}"
      - name: Tag and publish release
        # The image exists and is verified, so a Git tag never appears without an image.
        id: publish
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 #v6.0.0
        with:
          semantic_version: 25.0.2
          extra_plugins: |
            semantic-release-export-data@1.1.1
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify published version
        env:
          ACTUAL_VERSION: ${{ steps.publish.outputs.new-release-version }}
          EXPECTED_VERSION: ${{ needs.compute-version.outputs.new-release-version }}
          RELEASED: ${{ steps.publish.outputs.new-release-published }}
        run: test "${RELEASED}" = true && test "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}"
      - name: Login to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 #v3.7.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.ARTIFACTORY_O28M_PUSH_USER }}
          password: ${{ secrets.ARTIFACTORY_O28M_PUSH_TOKEN }}
      - name: Install crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b #v0.7
      - name: Update and verify release alias
        # `latest` tracks the newest stable release and `next` the newest release candidate.
        env:
          BRANCH: ${{ github.ref_name }}
          DIGEST: ${{ needs.publish-image.outputs.image-digest }}
        run: |
          if [ "${BRANCH}" = "next" ]; then
            alias=next
          else
            alias=latest
          fi
          crane tag "${IMAGE_REPOSITORY}@${DIGEST}" "${alias}"
          test "$(crane digest "${IMAGE_REPOSITORY}:${alias}")" = "${DIGEST}"
